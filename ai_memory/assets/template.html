<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ai-memory graph</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #101418; color: #d8dee6; }
  #graph { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; width: 240px; background: #1a2027ee;
           border: 1px solid #2c3540; border-radius: 8px; padding: 10px 12px; z-index: 5;
           max-height: 92vh; overflow: auto; }
  #etypef { max-height: 150px; overflow: auto; border: 1px solid #2c3540; border-radius: 4px;
            padding: 4px 6px; }
  #etypef label { font-size: 12px; }
  .preset { background: #232c36; color: #d8dee6; border: 1px solid #2c3540; border-radius: 4px;
            padding: 2px 7px; margin: 0 3px 3px 0; cursor: pointer; font-size: 11px; }
  .preset:hover { background: #2c3540; }
  #detail { position: absolute; top: 10px; right: 10px; width: 300px; max-height: 85vh; overflow: auto;
            background: #1a2027ee; border: 1px solid #2c3540; border-radius: 8px; padding: 10px 12px;
            z-index: 5; display: none; }
  h4 { margin: 6px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #8b98a8; }
  label { display: block; margin: 2px 0; }
  input[type=text], select { width: 100%; box-sizing: border-box; background: #101418; color: #d8dee6;
           border: 1px solid #2c3540; border-radius: 4px; padding: 3px 6px; }
  input[type=range] { width: 100%; }
  .hint { color: #6d7a8a; font-size: 11px; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; margin-right: 4px; }
  .untrusted { background: #7a2e12; }
  #detail .content { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="panel">
  <h4>ai-memory graph</h4>
  <div id="counts" class="hint"></div>
  <h4>Kinds</h4>
  <label><input type="checkbox" class="kindf" value="semantic" checked> semantic</label>
  <label><input type="checkbox" class="kindf" value="procedural" checked> procedural</label>
  <label><input type="checkbox" class="kindf" value="episodic" checked> episodic</label>
  <label><input type="checkbox" class="kindf" value="entity" checked> entities</label>
  <label><input type="checkbox" class="kindf" value="role" checked> roles</label>
  <label><input type="checkbox" id="memf" checked> memory nodes</label>
  <h4>Presets</h4>
  <div id="presets">
    <button class="preset" data-preset="professional">professional</button>
    <button class="preset" data-preset="personal">personal</button>
    <button class="preset" data-preset="infra">infrastructure</button>
    <button class="preset" data-preset="everything">everything</button>
  </div>
  <h4>Entity types <span id="etcount" class="hint"></span></h4>
  <div id="etypef"></div>
  <h4>Connections <span id="degval" class="hint">2 to any</span></h4>
  <input type="range" id="degmin" min="0" max="10" step="1" value="2">
  <input type="range" id="degmax" min="0" max="900" step="10" value="0">
  <h4>Scope</h4>
  <select id="scopef"><option value="">all scopes</option></select>
  <h4>Relation</h4>
  <select id="relf"><option value="">all relations</option></select>
  <h4>Min link weight <span id="wval" class="hint">0</span></h4>
  <input type="range" id="weightf" min="0" max="1" step="0.02" value="0">
  <h4>Created between</h4>
  <input type="text" id="datefrom" placeholder="YYYY-MM-DD">
  <input type="text" id="dateto" placeholder="YYYY-MM-DD" style="margin-top:3px">
  <h4>Search</h4>
  <input type="text" id="search" placeholder="find and centre (Enter)">
  <div id="supwrap" style="display:none"><h4>Overlays</h4>
    <label><input type="checkbox" id="supf"> supersession chains</label></div>
  <h4>Colour by</h4>
  <select id="colourm">
    <option value="type" selected>memory type</option>
    <option value="etype">entity kind</option>
    <option value="scope">scope</option>
    <option value="node">each node</option>
  </select>
  <div id="legend" class="hint"></div>
  <h4>Labels + layout</h4>
  <label><input type="checkbox" id="nlabels"> node labels</label>
  <label><input type="checkbox" id="elabels"> edge labels</label>
  <label><input type="checkbox" id="flowf"> flow view LHS to RHS (ego)</label>
  <label><input type="checkbox" id="familyf"> family view (generations)</label>
  <label><input type="checkbox" id="dirout" checked> flow from (outgoing)</label>
  <label><input type="checkbox" id="dirin" checked> flow to (incoming)</label>
  <h4>Clusters</h4>
  <div id="clusters"></div>
  <h4>Decay scrubber <span id="tval" class="hint">t+0d</span></h4>
  <input type="range" id="scrub" min="0" max="180" step="5" value="0">
  <p class="hint">Click a node: ego view (click again: +1 hop, Esc: reset).</p>
</div>
<div id="detail"></div>
<script>/*__LIB__*/</script>
<script>
const MODE = "__MODE__";
const EMBEDDED = __DATA__;

const COLORS = { semantic: "#4ea1ff", procedural: "#3ecf8e", episodic: "#c9a227",
                 entity: "#b07ce8", role: "#2bb3a3", cluster: "#5c6b7a", quarantined: "#ff5c33" };

function hueColor(key, s = 65, l = 55) {
  // stable golden-angle hue from a string: distinct, deterministic colours
  let h = 0;
  for (const ch of String(key)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return `hsl(${Math.round((h % 1000) / 1000 * 360)}, ${s}%, ${l}%)`;
}

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function humanise(r) { return String(r || "").replace(/_/g, " "); }
function short(s, n = 24) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function boot(data) {
  const byId = new Map(data.nodes.map(n => [n.id, n]));
  const adj = new Map(data.nodes.map(n => [n.id, new Set()]));
  const adjOut = new Map(data.nodes.map(n => [n.id, new Set()]));
  const adjIn = new Map(data.nodes.map(n => [n.id, new Set()]));
  data.links.forEach(l => {
    const s = typeof l.source === "object" ? l.source.id : l.source;
    const t = typeof l.target === "object" ? l.target.id : l.target;
    l._s = s; l._t = t;
    adj.get(s)?.add(t); adj.get(t)?.add(s);
    adjOut.get(s)?.add(t); adjIn.get(t)?.add(s);
  });
  const dirNeighbours = id => {
    const out = document.getElementById("dirout").checked;
    const inc = document.getElementById("dirin").checked;
    const result = new Set();
    if (out) adjOut.get(id)?.forEach(m => result.add(m));
    if (inc) adjIn.get(id)?.forEach(m => result.add(m));
    return result;
  };

  // Family view (#62): generation levels by constraint propagation.
  const FAMILY_DELTA = { parent_of: 1, grandparent_of: 2 };
  const FAMILY_EQ = new Set(["married_to", "sibling_of"]);
  const famLinks = data.links.filter(l =>
    l.kind === "edge" && (l.rel in FAMILY_DELTA || FAMILY_EQ.has(l.rel)));
  const familyIds = new Set();
  famLinks.forEach(l => { familyIds.add(l._s); familyIds.add(l._t); });

  function solveGenerations(ids) {
    const level = new Map([...ids].map(id => [id, 0]));
    for (let pass = 0; pass < 30; pass++) {
      let changed = false;
      famLinks.forEach(l => {
        if (!level.has(l._s) || !level.has(l._t)) return;
        if (FAMILY_EQ.has(l.rel)) {
          const m = Math.max(level.get(l._s), level.get(l._t));
          if (level.get(l._s) !== m) { level.set(l._s, m); changed = true; }
          if (level.get(l._t) !== m) { level.set(l._t, m); changed = true; }
        } else {
          const d = FAMILY_DELTA[l.rel];
          const wantChild = level.get(l._s) + d;
          if (level.get(l._t) < wantChild) { level.set(l._t, wantChild); changed = true; }
          const wantParent = level.get(l._t) - d;
          if (level.get(l._s) < wantParent) { level.set(l._s, wantParent); changed = true; }
        }
      });
      if (!changed) break;
    }
    const min = Math.min(...level.values());
    level.forEach((v, k) => level.set(k, v - min));
    return level;
  }

  function applyFamily(vis) {
    const present = new Set(vis.nodes.map(n => n.id));
    const ids = [...familyIds].filter(id => present.has(id));
    if (!ids.length) return;
    const level = solveGenerations(new Set(ids));
    const cols = [];
    vis.nodes.forEach(n => {
      if (!level.has(n.id)) return;
      const d = level.get(n.id);
      (cols[d] = cols[d] || []).push(n);
    });
    cols.forEach(ns => ns && ns.sort((a, b) => String(a.label).localeCompare(String(b.label))));
    // barycenter passes against the previous generation
    const index = new Map();
    const reindex = ns => ns.forEach((n, i) => index.set(n.id, i));
    const famAdj = new Map();
    famLinks.forEach(l => {
      if (!famAdj.has(l._s)) famAdj.set(l._s, new Set());
      if (!famAdj.has(l._t)) famAdj.set(l._t, new Set());
      famAdj.get(l._s).add(l._t); famAdj.get(l._t).add(l._s);
    });
    for (let sweep = 0; sweep < 3; sweep++) {
      for (let d = 1; d < cols.length; d++) {
        if (!cols[d] || !cols[d - 1]) continue;
        reindex(cols[d - 1]);
        const refIds = new Set(cols[d - 1].map(m => m.id));
        cols[d].sort((a, b) => {
          const bc = n => {
            const neigh = [...(famAdj.get(n.id) || [])].filter(id => refIds.has(id));
            return neigh.length ? neigh.reduce((s, id) => s + index.get(id), 0) / neigh.length
                                : Number.POSITIVE_INFINITY;
          };
          return bc(a) - bc(b) || String(a.label).localeCompare(String(b.label));
        });
      }
    }
    // spouse adjacency: married pairs sit together, equal footing
    const married = famLinks.filter(l => l.rel === "married_to");
    cols.forEach(ns => {
      if (!ns) return;
      married.forEach(l => {
        const i = ns.findIndex(n => n.id === l._s);
        const j = ns.findIndex(n => n.id === l._t);
        if (i < 0 || j < 0 || Math.abs(i - j) === 1) return;
        const [partner] = ns.splice(j, 1);
        ns.splice(ns.findIndex(n => n.id === l._s) + 1, 0, partner);
      });
    });
    cols.forEach((ns, d) => {
      if (ns) ns.forEach((n, i) => { n.fx = d * 220; n.fy = (i - (ns.length - 1) / 2) * 52; });
    });
  }
  // showing X of Y: with the filters doing real work, the store total on its
  // own tells you nothing about what is actually on screen
  function setCounts(vis) {
    document.getElementById("counts").textContent = vis
      ? `showing ${vis.nodes.length} of ${data.counts.nodes} nodes, `
        + `${vis.links.length} of ${data.counts.links} links`
      : `${data.counts.nodes} nodes, ${data.counts.links} links (${data.generated_at})`;
  }
  setCounts(null);

  const scopes = [...new Set(data.nodes.map(n => n.scope).filter(Boolean))].sort();
  const scopeSel = document.getElementById("scopef");
  scopes.forEach(s => scopeSel.add(new Option(s, s)));
  const rels = [...new Set(data.links.map(l => l.rel))].sort();
  const relSel = document.getElementById("relf");
  rels.forEach(r => relSel.add(new Option(humanise(r), r)));
  if (data.nodes.some(n => n.superseded)) document.getElementById("supwrap").style.display = "block";

  // connected components -> collapsible clusters
  const comp = new Map();
  let compCount = 0;
  data.nodes.forEach(seed => {
    if (comp.has(seed.id)) return;
    const queue = [seed.id];
    comp.set(seed.id, compCount);
    while (queue.length) {
      const id = queue.pop();
      adj.get(id)?.forEach(m => { if (!comp.has(m)) { comp.set(m, compCount); queue.push(m); } });
    }
    compCount++;
  });
  const compMembers = new Map();
  data.nodes.forEach(n => {
    const c = comp.get(n.id);
    if (!compMembers.has(c)) compMembers.set(c, []);
    compMembers.get(c).push(n);
  });
  const degree = id => (adj.get(id)?.size) || 0;
  const repOf = new Map();
  compMembers.forEach((ns, c) => {
    let best = ns[0];
    ns.forEach(n => { if (degree(n.id) > degree(best.id)) best = n; });
    repOf.set(c, best.label);
  });
  const collapsed = new Set();
  const metaCache = new Map();

  function buildClusterList() {
    const div = document.getElementById("clusters");
    const entries = [...compMembers.entries()].filter(e => e[1].length >= 3)
      .sort((a, b) => b[1].length - a[1].length).slice(0, 15);
    div.innerHTML = "";
    if (!entries.length) { div.innerHTML = '<span class="hint">no clusters of 3+</span>'; return; }
    const top = document.createElement("div");
    top.className = "hint";
    const ca = document.createElement("a"); ca.href = "#"; ca.textContent = "collapse all";
    const ea = document.createElement("a"); ea.href = "#"; ea.textContent = "expand all";
    ca.addEventListener("click", e => { e.preventDefault(); entries.forEach(en => collapsed.add(en[0])); buildClusterList(); refresh(); });
    ea.addEventListener("click", e => { e.preventDefault(); collapsed.clear(); buildClusterList(); refresh(); });
    top.appendChild(ca); top.appendChild(document.createTextNode("  ")); top.appendChild(ea);
    div.appendChild(top);
    entries.forEach(([c, ns]) => {
      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = collapsed.has(c);
      cb.addEventListener("change", () => { cb.checked ? collapsed.add(c) : collapsed.delete(c); refresh(); });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(" " + short(repOf.get(c), 22) + " (" + ns.length + ")"));
      div.appendChild(lab);
    });
  }
  buildClusterList();

  let ego = null, egoHops = 1, scrubDays = 0;

  function linkEff(l) {
    if (l._agg) return l.weight;
    if (l.weight_raw === undefined) return l.weight;
    return l.weight_raw * (1 / (1 + (l.age_days + scrubDays) / data.link_half_life_days));
  }
  function nodeKind(n) { return n.kind === "cluster" ? "cluster" : n.kind === "entity" ? (n.type === "role" ? "role" : "entity") : n.type; }

  function colourFor(n) {
    if (n.quarantined) return COLORS.quarantined;
    if (n.kind === "cluster") return COLORS.cluster;
    const mode = document.getElementById("colourm").value;
    if (mode === "etype") {
      if (n.kind === "entity") return hueColor("etype:" + n.type);
      return "#5b6672";  // memories muted: entities carry the distinction
    }
    if (mode === "scope") return hueColor("scope:" + (n.scope || "global"));
    if (mode === "node") return hueColor("node:" + n.label);
    return COLORS[nodeKind(n)] || "#8b98a8";
  }

  function renderLegend() {
    const mode = document.getElementById("colourm").value;
    const legend = document.getElementById("legend");
    const swatch = (colour, text) =>
      `<span style="color:${colour}">&#9679;</span> ${esc(text)}`;
    let items = [];
    if (mode === "type") {
      items = ["semantic", "procedural", "episodic", "entity", "role"]
        .map(k => swatch(COLORS[k], k));
    } else if (mode === "etype") {
      items = [...new Set(data.nodes.filter(n => n.kind === "entity").map(n => n.type))]
        .sort().slice(0, 10).map(e => swatch(hueColor("etype:" + e), e));
    } else if (mode === "scope") {
      items = [...new Set(data.nodes.map(n => n.scope || "global"))]
        .sort().slice(0, 10).map(s => swatch(hueColor("scope:" + s), s));
    } else {
      items = [swatch("#8b98a8", "one stable colour per node")];
    }
    legend.innerHTML = items.join("&nbsp; ");
  }
  function egoSet() {
    if (!ego) return null;
    let frontier = new Set([ego]), seen = new Set([ego]);
    for (let h = 0; h < egoHops; h++) {
      const next = new Set();
      frontier.forEach(id => dirNeighbours(id).forEach(m => { if (!seen.has(m)) { seen.add(m); next.add(m); } }));
      frontier = next;
    }
    return seen;
  }

  // ---- entity-type filter, presets and degree bounds (#76) ----
  const DOMAINS = {
    personal: ["artist", "song", "album", "music_genre", "pet", "crop", "seed_variety",
               "growing_area", "cuisine", "dish", "theatre_show", "activity", "wishlist_item",
               "season", "home_project"],
    infra: ["agent", "command", "system", "tool", "framework", "workflow", "file", "skill"],
    contact: ["phone", "email", "social_account", "website"],
  };
  const etypesOf = n => n.kind === "entity" ? (n.type || "thing") : null;

  function buildTypeList() {
    const counts = new Map();
    data.nodes.forEach(n => {
      const t = etypesOf(n);
      if (t) counts.set(t, (counts.get(t) || 0) + 1);
    });
    const box = document.getElementById("etypef");
    box.innerHTML = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([t, c]) =>
      `<label><input type="checkbox" class="etf" value="${t}" checked> ${t} <span class="hint">${c}</span></label>`
    ).join("");
    box.querySelectorAll(".etf").forEach(c => c.addEventListener("change", () => { typeCount(); refresh(); }));
  }

  function typeCount() {
    const all = document.querySelectorAll(".etf").length;
    const on = document.querySelectorAll(".etf:checked").length;
    document.getElementById("etcount").textContent = on === all ? "all" : `${on}/${all}`;
  }

  function setTypes(pred) {
    document.querySelectorAll(".etf").forEach(c => { c.checked = pred(c.value); });
    typeCount();
  }

  function applyPreset(name) {
    const excluded = new Set([...DOMAINS.personal, ...DOMAINS.infra, ...DOMAINS.contact]);
    const memOn = name === "everything";
    document.getElementById("memf").checked = memOn;
    if (name === "professional")   setTypes(t => !excluded.has(t));
    else if (name === "personal")  setTypes(t => DOMAINS.personal.includes(t) || t === "person" || t === "place");
    else if (name === "infra")     setTypes(t => DOMAINS.infra.includes(t) || t === "project");
    else                           setTypes(() => true);
    document.getElementById("degmin").value = name === "everything" ? 0 : 2;
    document.getElementById("degmax").value = 0;
    degLabel();
    refresh();
  }

  function degLabel() {
    const lo = document.getElementById("degmin").value;
    const hi = parseInt(document.getElementById("degmax").value, 10);
    document.getElementById("degval").textContent = `${lo} to ${hi ? hi : "any"}`;
  }

  // Degree is counted on the links that survive the other filters, so the
  // bounds mean "as currently displayed", not "in the whole store".
  function pruneByDegree(kept, keptIds, linkOK) {
    const lo = parseInt(document.getElementById("degmin").value, 10);
    const hi = parseInt(document.getElementById("degmax").value, 10);
    if (!lo && !hi) return kept;
    const deg = new Map();
    data.links.forEach(l => {
      if (!linkOK(l) || !keptIds.has(l._s) || !keptIds.has(l._t) || l._s === l._t) return;
      deg.set(l._s, (deg.get(l._s) || 0) + 1);
      deg.set(l._t, (deg.get(l._t) || 0) + 1);
    });
    return kept.filter(n => {
      const d = deg.get(n.id) || 0;
      return d >= lo && (!hi || d <= hi);
    });
  }

  function visible() {
    const kinds = new Set([...document.querySelectorAll(".kindf:checked")].map(c => c.value));
    const scope = scopeSel.value, rel = relSel.value;
    const minW = parseFloat(document.getElementById("weightf").value);
    const from = document.getElementById("datefrom").value, to = document.getElementById("dateto").value;
    const showSup = document.getElementById("supf")?.checked;
    const focus = egoSet();
    const familyOn = document.getElementById("familyf").checked;
    const memOn = document.getElementById("memf").checked;
    const etypes = new Set([...document.querySelectorAll(".etf:checked")].map(c => c.value));
    const linkOK = l => !(rel && l.rel !== rel)
      && !(l.kind === "supersedes" && !showSup)
      && linkEff(l) >= minW;
    let kept = data.nodes.filter(n =>
      (!familyOn || familyIds.has(n.id)) &&
      kinds.has(nodeKind(n)) &&
      (memOn || n.kind !== "memory") &&
      (n.kind !== "entity" || etypes.has(n.type || "thing")) &&
      (!scope || n.scope === scope || n.scope === "global" || n.kind === "entity") &&
      (!from || n.created >= from) && (!to || n.created <= to) &&
      (showSup || !n.superseded) &&
      (!focus || focus.has(n.id)));
    // an explicit focus or family view is the user asking for those exact
    // nodes, so the degree bounds must not then take them away again
    if (!focus && !familyOn) kept = pruneByDegree(kept, new Set(kept.map(n => n.id)), linkOK);
    const keptIds = new Set(kept.map(n => n.id));
    const outNodes = [];
    const metaNeeded = new Set();
    kept.forEach(n => {
      const c = comp.get(n.id);
      if (collapsed.has(c)) metaNeeded.add(c); else outNodes.push(n);
    });
    metaNeeded.forEach(c => {
      let m = metaCache.get(c);
      if (!m) {
        m = { id: "c" + c, kind: "cluster", comp: c, scope: "global", created: "", content: "" };
        metaCache.set(c, m);
      }
      m.label = "cluster: " + short(repOf.get(c), 18);
      m.count = (compMembers.get(c) || []).filter(n => keptIds.has(n.id)).length;
      outNodes.push(m);
    });
    const idMap = id => {
      if (!keptIds.has(id)) return null;
      const c = comp.get(id);
      return collapsed.has(c) ? "c" + c : id;
    };
    const outLinks = [];
    const aggregated = new Map();
    data.links.forEach(l => {
      if (!linkOK(l)) return;
      const s = idMap(l._s), t = idMap(l._t);
      if (!s || !t || s === t) return;
      if (s[0] === "c" || t[0] === "c") {
        const key = s + "|" + t + "|" + l.kind;
        const existing = aggregated.get(key);
        if (existing) { existing.count++; existing.weight = Math.max(existing.weight, linkEff(l)); }
        else aggregated.set(key, { source: s, target: t, _s: s, _t: t, kind: l.kind,
                                   rel: l.rel, weight: Math.max(0.2, linkEff(l)), count: 1, _agg: true });
      } else outLinks.push(l);
    });
    aggregated.forEach(a => outLinks.push(a));
    return { nodes: outNodes, links: outLinks };
  }

  function applyFlow(vis) {
    data.nodes.forEach(n => { delete n.fx; delete n.fy; });
    metaCache.forEach(m => { delete m.fx; delete m.fy; });
    if (!ego || !document.getElementById("flowf").checked) return;
    const present = new Set(vis.nodes.map(n => n.id));
    if (!present.has(ego)) return;
    const out = document.getElementById("dirout").checked;
    const inc = document.getElementById("dirin").checked;
    const nadj = new Map();
    vis.nodes.forEach(n => nadj.set(n.id, new Set()));
    vis.links.forEach(l => {
      if (out) nadj.get(l._s)?.add(l._t);
      if (inc) nadj.get(l._t)?.add(l._s);
    });
    const depth = new Map([[ego, 0]]);
    const queue = [ego];
    while (queue.length) {
      const id = queue.shift();
      nadj.get(id)?.forEach(m => { if (!depth.has(m)) { depth.set(m, depth.get(id) + 1); queue.push(m); } });
    }
    const maxDepth = Math.max(0, ...depth.values());
    const cols = [];
    vis.nodes.forEach(n => {
      const d = depth.has(n.id) ? depth.get(n.id) : maxDepth + 1;
      (cols[d] = cols[d] || []).push(n);
    });
    // Crossing minimisation: Sugiyama barycenter sweeps. Each column orders by
    // the mean position of its neighbours in the adjacent column; three
    // alternating passes converge well at this scale and stay deterministic.
    cols.forEach(ns => ns && ns.sort((a, b) => String(a.label).localeCompare(String(b.label))));
    const index = new Map();
    const reindex = ns => ns.forEach((n, i) => index.set(n.id, i));
    const bary = (n, colIds) => {
      const neigh = [...(nadj.get(n.id) || [])].filter(id => colIds.has(id));
      return neigh.length
        ? neigh.reduce((sum, id) => sum + index.get(id), 0) / neigh.length
        : Number.POSITIVE_INFINITY;
    };
    const orderBy = (target, reference) => {
      if (!target || !reference) return;
      reindex(reference);
      const refIds = new Set(reference.map(m => m.id));
      target.sort((a, b) => bary(a, refIds) - bary(b, refIds)
        || String(a.label).localeCompare(String(b.label)));
    };
    for (let sweep = 0; sweep < 3; sweep++) {
      for (let d = 1; d < cols.length; d++) orderBy(cols[d], cols[d - 1]);
      for (let d = cols.length - 2; d >= 1; d--) orderBy(cols[d], cols[d + 1]);
    }
    cols.forEach((ns, d) => {
      if (ns) ns.forEach((n, i) => { n.fx = d * 200; n.fy = (i - (ns.length - 1) / 2) * 48; });
    });
  }

  const graph = ForceGraph()(document.getElementById("graph"))
    .nodeId("id")
    .nodeLabel(n => esc(n.label))
    .nodeVal(n => n.kind === "cluster" ? 4 + Math.sqrt(n.count || 1) * 3
                  : 3 + Math.sqrt(n.recall_count || 0) * 3 + (n.pinned ? 3 : 0))
    .nodeColor(n => colourFor(n))
    .nodeCanvasObjectMode(n => (n.verify_overdue || n.quarantined) ? "before" : undefined)
    .nodeCanvasObject((n, ctx) => {
      ctx.beginPath();
      ctx.arc(n.x, n.y, 7 + Math.sqrt(n.recall_count || 0) * 1.5, 0, 2 * Math.PI);
      ctx.strokeStyle = n.quarantined ? "#ff5c33" : "#e04545";
      ctx.setLineDash([2, 2]); ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
    })
    .linkWidth(l => Math.max(0.4, linkEff(l) * 4))
    .linkLineDash(l => !l._agg && linkEff(l) < data.link_prune_floor * 3 ? [3, 3] : null)
    .linkColor(l => l.kind === "mention" ? "#b07ce866" : l.kind === "edge" ? "#b07ce8aa"
                    : l.kind === "supersedes" ? "#e04545aa" : "#7d8b9c88")
    .linkDirectionalArrowLength(l => l.kind === "mention" ? 3 : 4.5)
    .linkDirectionalArrowRelPos(0.92)
    .onNodeClick(n => {
      if (n.kind === "cluster") { collapsed.delete(n.comp); buildClusterList(); refresh(); return; }
      if (ego === n.id) { egoHops = Math.min(egoHops + 1, 4); } else { ego = n.id; egoHops = 1; }
      showDetail(n); refresh();
    })
    .onBackgroundClick(() => { hideDetail(); })
    .onRenderFramePost((ctx, gs) => {
      const g = graph.graphData();
      if (document.getElementById("nlabels").checked && (gs > 0.7 || g.nodes.length <= 60)) {
        ctx.font = `${11 / gs}px sans-serif`;
        ctx.fillStyle = "#c6cfda"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        g.nodes.forEach(n => {
          if (n.x === undefined) return;
          const text = n.kind === "entity" || n.kind === "cluster" ? short(n.label, 26) : short(n.label, 20);
          ctx.fillText(text, n.x + 10 / gs + 2, n.y);
        });
      }
      if (document.getElementById("elabels").checked && gs > 0.9) {
        ctx.font = `${9 / gs}px sans-serif`;
        ctx.fillStyle = "#8b98a8"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        g.links.forEach(l => {
          const s = l.source, t = l.target;
          if (typeof s !== "object" || s.x === undefined || typeof t !== "object" || t.x === undefined) return;
          const text = l._agg ? humanise(l.rel) + " x" + l.count : humanise(l.rel);
          ctx.fillText(text, (s.x + t.x) / 2, (s.y + t.y) / 2 - 2 / gs);
        });
      }
    });

  function refresh() {
    const vis = visible();
    if (document.getElementById("familyf").checked) {
      data.nodes.forEach(n => { delete n.fx; delete n.fy; });
      metaCache.forEach(m => { delete m.fx; delete m.fy; });
      applyFamily(vis);
    } else {
      applyFlow(vis);
    }
    graph.graphData(vis);
    setCounts(vis);
  }

  function showDetail(n) {
    const d = document.getElementById("detail");
    if (n.kind === "cluster") {
      d.innerHTML = `<b>${esc(n.label)}</b><div class="hint">${n.count} node(s) in view. Click the node to expand the cluster.</div>`;
      d.style.display = "block";
      return;
    }
    const mentions = data.links.filter(l => l.kind === "mention" && (l._s === n.id || l._t === n.id))
      .map(l => byId.get(l._s === n.id ? l._t : l._s)?.label).filter(Boolean);
    d.innerHTML = `
      ${n.quarantined ? '<span class="badge untrusted">UNTRUSTED</span>' : ""}
      <b>${esc(n.kind === "entity" ? n.label : nodeKind(n))}</b>
      <span class="hint">${esc(n.id)} · ${esc(n.created)}${n.scope && n.scope !== "global" ? " · " + esc(n.scope) : ""}</span>
      <div class="content">${esc(n.content || "")}</div>
      <div class="hint">
        ${n.kind === "memory" ? `recalled ${n.recall_count} time(s) · confidence ${n.confidence}` : ""}
        ${n.pinned ? " · pinned" : ""}${n.valence ? " · valence " + esc(n.valence) : ""}
        ${n.verify_overdue ? " · <b>VERIFY overdue</b>" : ""}
        ${n.superseded ? " · superseded" : ""}
        ${n.promoted_from ? ` · distilled from m${n.promoted_from}` : ""}
      </div>
      ${mentions.length ? `<h4>Mentions</h4><div class="hint">${esc(mentions.join(", "))}</div>` : ""}
      <p class="hint">ego ${egoHops} hop(s): click again to expand, Esc to reset</p>`;
    d.style.display = "block";
  }
  function hideDetail() { document.getElementById("detail").style.display = "none"; }

  document.querySelectorAll(".kindf").forEach(c => c.addEventListener("change", refresh));
  document.getElementById("memf").addEventListener("change", refresh);
  document.querySelectorAll(".preset").forEach(b =>
    b.addEventListener("click", () => applyPreset(b.dataset.preset)));
  ["degmin", "degmax"].forEach(id =>
    document.getElementById(id).addEventListener("input", () => { degLabel(); refresh(); }));
  ["scopef", "relf", "datefrom", "dateto"].forEach(id =>
    document.getElementById(id).addEventListener("change", refresh));
  document.getElementById("supf")?.addEventListener("change", refresh);
  ["nlabels", "elabels", "flowf", "familyf", "dirout", "dirin"].forEach(id =>
    document.getElementById(id).addEventListener("change", refresh));
  document.getElementById("colourm").addEventListener("change", () => { renderLegend(); refresh(); });
  renderLegend();
  buildTypeList();
  document.getElementById("weightf").addEventListener("input", e => {
    document.getElementById("wval").textContent = e.target.value; refresh();
  });
  document.getElementById("scrub").addEventListener("input", e => {
    scrubDays = parseInt(e.target.value, 10);
    document.getElementById("tval").textContent = `t+${scrubDays}d`; refresh();
  });
  document.getElementById("search").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const q = e.target.value.toLowerCase();
    const hit = data.nodes.find(n => (n.label || "").toLowerCase().includes(q));
    if (hit) { ego = hit.id; egoHops = 1; refresh(); showDetail(hit);
      setTimeout(() => { graph.centerAt(hit.x, hit.y, 600); graph.zoom(4, 600); }, 350); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { ego = null; egoHops = 1; hideDetail(); refresh(); }
  });
  applyPreset("professional");
}

if (MODE === "serve") {
  fetch("/data.json").then(r => r.json()).then(boot);
} else {
  boot(EMBEDDED);
}
</script>
</body>
</html>
